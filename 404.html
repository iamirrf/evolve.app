<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Cognein</title>
<meta name="description" content="That page does not exist.">
<meta name="theme-color" content="#05070B">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">

<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/styles.css">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<header class="header is-scrolled">
  <div class="container">
    <a class="brand" href="/" aria-label="Cognein home">
      <img src="/assets/logo-96.png" alt="" width="30" height="30">
      Cognein
    </a>
    <div class="header-actions">
      <a class="btn btn--primary" href="https://app.cognein.com">Get started</a>
    </div>
  </div>
</header>

<main class="notfound">
  <div>
    <p class="eyebrow">Error 404</p>
    <p class="notfound__code gradient-text">404</p>
    <h1 style="font-size:var(--fs-h2);margin-top:0.5rem">This page took a day off</h1>
    <p class="lead" style="max-width:38ch;margin:1.25rem auto 0">
      The link is broken or the page has moved. Your streak is safe.
    </p>
    <div class="hero-cta" style="justify-content:center">
      <a class="btn btn--primary btn--lg" href="/">Back to home</a>
      <a class="btn btn--ghost btn--lg" href="https://app.cognein.com">Open the web app</a>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0;justify-content:center">
      <p>&copy; <span data-year>2025</span> Cognein · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></p>
    </div>
  </div>
</footer>

<script src="/main.js" defer></script>
</body>
</html>
